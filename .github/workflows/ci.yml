name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  quality:
    name: quality / coverage / package / docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check
      - name: Static correctness
        run: ruff check src tests scripts
      - name: Test with branch coverage
        run: pytest --timeout=120 --cov=g2mrf --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Build wheel
        run: pip wheel . --no-deps -w dist
      - name: CLI end-to-end smoke
        run: |
          g2mrf --help
          g2mrf plan --h2 0.35 --me 75000 --n 20000 50000 --target 0.05
          g2mrf demo --n 420 --variants 100 --landmarks 20 --bootstrap 20 --out results/ci_demo.json
          python -c "import json; p=json.load(open('results/ci_demo.json', encoding='utf-8')); assert len(p['decision']['gates']) == 5"
      - name: Docker build and smoke
        run: |
          docker build -t g2mrf-ci .
          docker run --rm g2mrf-ci plan --h2 0.35 --me 75000 --n 20000 --target 0.05

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check
      - name: Full test suite
        run: pytest --timeout=120
      - name: CLI smoke
        run: |
          g2mrf --help
          g2mrf plan --h2 0.35 --me 75000 --n 20000 --target 0.05
