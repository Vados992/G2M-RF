[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2m-rf"
version = "2.0.0"
description = "Executable research implementation of the G2M-RF Genotype-to-Morphology Research Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Vadym Tsinderhoz"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]
vcf = ["cyvcf2>=0.31"]

[project.scripts]
g2mrf = "g2mrf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["g2mrf"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Stable correctness-oriented baseline. Formatting/import ordering is kept separate
# from executable correctness so CI behavior does not change with Ruff defaults.
select = ["E4", "E7", "E9", "F"]
